[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "vpt-segmentation-packing"
version = "0.1.0"
description = "A package for packing and processing VPT segmentation data"
readme = "README.md"
authors = ["IMCF <your.email@example.com>"]
license = "MIT"
keywords = ["segmentation", "packing", "vpt", "visualization"]
homepage = "https://github.com/imcf/vpt-segmentation-packing"
repository = "https://github.com/imcf/vpt-segmentation-packing"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = ".", from = "." }]

[tool.poetry.dependencies]
python = "^3.9"
numpy = ">=1.20.0"
pandas = ">=1.3.0"
shapely = ">=1.8.0"
pyarrow = ">=6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
