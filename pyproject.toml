[tool.poetry]
name = "vpt-segmentation-packing"
version = "0.1.0"
description = "A package for packing and processing VPT segmentation data"
license = "MIT"
authors = ["Vizgen <techsupport@vizgen.com>", "IMCF <imcf@unibas.ch>"]
maintainers = [
    "Timothy Wiggin <timothy.wiggin@vizgen.com>",
    "IMCF <imcf@unibas.ch>",
]
readme = "README.md"
repository = "https://github.com/imcf/vpt-segmentation-packing"
documentation = "https://github.com/imcf/vpt-segmentation-packing"
keywords = ["segmentation", "packing", "vpt", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "vpt_segmentation_packing", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
numpy = ">=1.20.0"
pandas = ">=1.3.0"
shapely = ">=1.8.0"
pyarrow = ">=6.0.0"
mapbox-earcut = ">=0.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
pytest-cov = "^4.0.0"
ruff = ">=0.1.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
